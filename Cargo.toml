[package]
name = "sealed"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Experimental offline CLI for authenticated single-use encrypted letters"
publish = false

[dependencies]
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
getrandom = { version = "=0.2.16", default-features = true }
hkdf = { version = "=0.12.4", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "=1.8.1", default-features = false, features = ["alloc"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
